site_name: InferCell.jl
site_description: Composable, inference-first whole-cell modelling in Julia.
site_url: https://macsys-coe.github.io/InferCell/
repo_url: https://github.com/MACSYS-CoE/InferCell
repo_name: MACSYS-CoE/InferCell
edit_uri: edit/main/docs/
strict: true
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - exclude:
      glob:
        - .DS_Store
        # Session handoff notes are for the next session, not the docs site.
        - handoff.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - ODE inference (NUTS): user-guide/ode-inference.md
      - SSA inference (ABC-SMC): user-guide/ssa-inference.md
      - Boundary protocol: user-guide/boundary-protocol.md
  - API reference:
      - Overview: api/index.md
      - Parameters: api/parameters.md
      - Sub-model interface: api/interface.md
      - Core A′ interface contract: api/corea-interface.md
      - Orchestrator: api/orchestrator.md
      - Handshake driver: api/handshake.md
      - Inference: api/inference.md
      - Boundary: api/boundary.md
      - Models: api/models.md
