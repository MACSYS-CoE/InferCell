name: Test

# Fast PR-gating tests: unit suite + Aqua quality checks only.
# Expensive Bayesian integration tests (NUTS/ABC-SMC) live in
# `integration.yml` and run on push to main + weekly cron instead —
# they're CPU-bound and don't fit in a sensible PR feedback loop on
# free GitHub-hosted runners.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Julia ${{ matrix.julia-version }})
    runs-on: ${{ matrix.os }}
    # Cached runs land in ~3-5 min. The 40-min ceiling covers a first-ever
    # cold run (no cache anywhere) that must precompile the full stack before
    # it can save a cache; subsequent PRs reuse main's cache and finish fast.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v3

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1

      - uses: julia-actions/julia-processcoverage@v1

      - name: Summarise coverage
        if: always()
        shell: bash
        run: |
          if [ ! -f lcov.info ]; then
            echo "No lcov.info produced; skipping coverage summary." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # lcov.info uses LF/LH records: lines-found / lines-hit per file.
          read found hit < <(awk '
            /^LF:/ { f += substr($0, 4) + 0 }
            /^LH:/ { h += substr($0, 4) + 0 }
            END { print f, h }
          ' lcov.info)
          if [ "${found:-0}" -gt 0 ]; then
            pct=$(awk -v h="$hit" -v f="$found" 'BEGIN { printf "%.1f", (h / f) * 100 }')
            echo "**Coverage: ${pct}%** (${hit} / ${found} lines)" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage: ${pct}% (${hit} / ${found} lines)"
          else
            echo "No coverage data recorded." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload lcov artifact
        if: always() && hashFiles('lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-julia${{ matrix.julia-version }}
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 14
