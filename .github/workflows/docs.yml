name: Documentation

# Documenter build. On a pull request this is a build-only check: `deploydocs`
# is a no-op unless the run is a push to `devbranch` or a tag, so the gate the
# old MkDocs workflow needed (the `DOCS_DEPLOY_ENABLED` repo variable, which
# existed only because GitHub Pages will not serve a private repo on the free
# plan) is gone. Pages source for this repo is the `gh-pages` branch, which
# `deploydocs` writes.

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: read
  statuses: write

jobs:
  docs:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.10"

      - uses: julia-actions/cache@v3

      - name: Resolve the docs environment
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.instantiate()'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Not required while the repo and its Pages site are public; set it
          # if deployment ever needs to happen over SSH instead.
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
