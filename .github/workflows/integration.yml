name: Integration

# Bayesian integration tests (NUTS, ABC-SMC) gated by
# INFERCELL_INTEGRATION_TESTS=true. These are CPU-bound and slow on
# GitHub-hosted runners — too slow to gate every PR — so they run:
#   - on every push to main (catches regressions within minutes of merge)
#   - on a weekly cron (catches upstream package drift)
#   - on-demand via workflow_dispatch

on:
  push:
    branches: [main]
  schedule:
    # Mondays 04:00 UTC. Lines up with the start of the working week
    # in Australia/Europe; misses get re-run by the next push to main.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests (Julia ${{ matrix.julia-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10"]
        os: [ubuntu-latest]
    env:
      INFERCELL_INTEGRATION_TESTS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v3

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
